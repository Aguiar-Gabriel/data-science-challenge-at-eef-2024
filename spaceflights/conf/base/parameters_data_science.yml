# Parâmetros para a pipeline de Data Science

# Ative ou desative o balanceamento de classes com SMOTE
use_smote: true

# ==============================================================================
# Definição dos Modelos
# ==============================================================================
models:
  random_forest:
    type: sklearn.ensemble.RandomForestClassifier
    params:
      n_estimators: 100
      random_state: 42

  xgboost:
    type: xgboost.XGBClassifier
    params:
      n_estimators: 200
      learning_rate: 0.1
      random_state: 42

  catboost:
    type: catboost.CatBoostClassifier
    params:
      iterations: 500
      learning_rate: 0.05
      random_state: 42
      verbose: 0
    cat_features: null # Deixe nulo para detecção automática

# ==============================================================================
# Otimização de Hiperparâmetros (Grid Search)
# ==============================================================================
hyperparameter_tuning:
  enabled: true # Mude para false para desativar a otimização e usar os `params` acima

  # Defina aqui os modelos que você quer otimizar (devem corresponder aos nomes em `models`)
  models_to_tune:
    - random_forest
    - xgboost

  # Grade de parâmetros para o GridSearchCV
  grids:
    sklearn.ensemble.RandomForestClassifier:
      n_estimators: [100, 200]
      max_depth: [10, 20, null]
      min_samples_leaf: [1, 2, 4]

    xgboost.XGBClassifier:
      n_estimators: [100, 200, 300]
      learning_rate: [0.01, 0.1]
      max_depth: [3, 5, 7]

    catboost.CatBoostClassifier:
      iterations: [500, 1000]
      learning_rate: [0.01, 0.05, 0.1]
      depth: [4, 6, 8]
